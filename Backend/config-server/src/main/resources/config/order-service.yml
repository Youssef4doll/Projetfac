server:
  port: 8083
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/order_db}
    username: ${DB_USER:dropwear}
    password: ${DB_PASSWORD:dropwear}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # Validation 2 : remplacer par Flyway
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: order-service
            client-secret: ${CLIENT_SECRET:order-service-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/dropwear/protocol/openid-connect/token}

# Resilience4j : le circuit breaker (avec fallback) enveloppe le retry.
resilience4j:
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$Conflict
          - feign.FeignException$BadRequest
  retry:
    retry-aspect-order: 2
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - feign.RetryableException
          - feign.FeignException$ServiceUnavailable
          - feign.FeignException$BadGateway
          - feign.FeignException$GatewayTimeout
dropwear:
  outbox:
    poll-interval-ms: 2000
  reservation:
    ttl-minutes: 30
