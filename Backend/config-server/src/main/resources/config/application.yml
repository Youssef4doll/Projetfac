# Configuration commune à tous les clients du Config Server.
# Les valeurs ${VAR:défaut} permettent de lancer un service depuis l'IDE (défauts localhost) ou dans Docker (variables).
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,retries
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer = URL vue par le navigateur ; jwk-set-uri = URL interne Docker (évite le piège « issuer mismatch »)
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/dropwear}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/dropwear/protocol/openid-connect/certs}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 2000
          inventory-service:
            read-timeout: 3000

