# DropWear — plateforme complète.
#   Développement : docker compose --profile infra up -d      (bases, Kafka, Keycloak) puis lancer les services depuis l'IDE
#   Démonstration : docker compose --profile all up -d --build (tout, ~21 conteneurs, 8 à 12 Go de RAM)
# Règle : UNE base par service, jamais partagée (un conteneur chacune, identifiants distincts).
name: dropwear

x-spring-env: &spring-env
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://eureka-server:8761/eureka
  KAFKA_BOOTSTRAP: kafka:29092
  # issuer = URL vue par le navigateur (claim « iss » des jetons) ; JWKS et token = URL interne au réseau Docker
  KEYCLOAK_ISSUER: http://localhost:8180/realms/dropwear
  KEYCLOAK_JWKS: http://keycloak:8080/realms/dropwear/protocol/openid-connect/certs
  KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/dropwear/protocol/openid-connect/token
  JAVA_OPTS: -Xms128m -Xmx256m

x-spring-deps: &spring-deps
  kafka:
    condition: service_healthy
  config-server:
    condition: service_started
  eureka-server:
    condition: service_started

services:
  # ------------------------------------------------------------------ bases de données (1 par service)
  user-db:
    image: postgres:16-alpine
    profiles: [infra, all]
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: dropwear
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dropwear}
    ports: ["5433:5432"]
    volumes: [user-db-data:/var/lib/postgresql/data]
    healthcheck: &pg-health
      test: ["CMD-SHELL", "pg_isready -U dropwear"]
      interval: 5s
      retries: 20

  order-db:
    image: postgres:16-alpine
    profiles: [infra, all]
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: dropwear
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dropwear}
    ports: ["5434:5432"]
    volumes: [order-db-data:/var/lib/postgresql/data]
    healthcheck: *pg-health

  inventory-db:
    image: postgres:16-alpine
    profiles: [infra, all]
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: dropwear
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dropwear}
    ports: ["5435:5432"]
    volumes: [inventory-db-data:/var/lib/postgresql/data]
    healthcheck: *pg-health

  fulfillment-db:
    image: postgres:16-alpine
    profiles: [infra, all]
    environment:
      POSTGRES_DB: fulfillment_db
      POSTGRES_USER: dropwear
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dropwear}
    ports: ["5436:5432"]
    volumes: [fulfillment-db-data:/var/lib/postgresql/data]
    healthcheck: *pg-health

  return-db:
    image: mysql:8.4
    profiles: [infra, all]
    environment:
      MYSQL_DATABASE: return_db
      MYSQL_USER: dropwear
      MYSQL_PASSWORD: ${DB_PASSWORD:-dropwear}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports: ["3307:3306"]
    volumes: [return-db-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      retries: 30

  catalog-db:
    image: mongo:7.0
    profiles: [infra, all]
    ports: ["27017:27017"]
    volumes: [catalog-db-data:/data/db]
    healthcheck: &mongo-health
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 20

  ticketing-db:
    image: mongo:7.0
    profiles: [infra, all]
    ports: ["27018:27017"]
    volumes: [ticketing-db-data:/data/db]
    healthcheck: *mongo-health

  # ------------------------------------------------------------------ Keycloak (IdP) et sa propre base
  keycloak-db:
    image: postgres:16-alpine
    profiles: [infra, all]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes: [keycloak-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      retries: 20

  keycloak:
    image: keycloak/keycloak:26.0.7          # miroir Docker Hub de quay.io/keycloak/keycloak
    profiles: [infra, all]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: http://localhost:8180       # émetteur (iss) identique pour le navigateur et les services
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"  # les services joignent keycloak:8080 en interne
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8180:8080"]
    volumes:
      - ./Backend/infrastructure/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  # ------------------------------------------------------------------ Kafka (KRaft, sans Zookeeper)
  kafka:
    image: apache/kafka:3.8.1
    profiles: [infra, all]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.1
    profiles: [infra, all]
    entrypoint: ["sh", "/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:29092
    volumes:
      - ./Backend/infrastructure/kafka/create-topics.sh:/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: [infra, all]
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: dropwear
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on: [kafka]

  # ------------------------------------------------------------------ Spring Cloud
  config-server:
    build: ./Backend/config-server
    profiles: [spring, all]
    ports: ["8888:8888"]
    environment:
      JAVA_OPTS: -Xms64m -Xmx192m

  eureka-server:
    build: ./Backend/eureka-server
    profiles: [spring, all]
    ports: ["8761:8761"]
    environment:
      EUREKA_HOSTNAME: eureka-server
      JAVA_OPTS: -Xms64m -Xmx192m

  api-gateway:
    build: ./Backend/api-gateway
    profiles: [spring, all]
    ports: ["8080:8080"]
    environment:
      <<: *spring-env
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
    restart: on-failure

  # ------------------------------------------------------------------ microservices métier
  user-service:
    build: ./Backend/user-service
    profiles: [all]
    environment:
      <<: *spring-env
      DB_URL: jdbc:postgresql://user-db:5432/user_db
      DB_PASSWORD: ${DB_PASSWORD:-dropwear}
      CLIENT_SECRET: ${USER_SERVICE_SECRET:-user-service-secret}
      KEYCLOAK_ADMIN_URL: http://keycloak:8080/admin/realms/dropwear
    depends_on:
      <<: *spring-deps
      user-db:
        condition: service_healthy
    restart: on-failure

  catalog-service:
    build: ./Backend/catalog-service
    profiles: [all]
    environment:
      <<: *spring-env
      MONGO_URI: mongodb://catalog-db:27017/catalog_db
    depends_on:
      <<: *spring-deps
      catalog-db:
        condition: service_healthy
    restart: on-failure

  order-service:
    build: ./Backend/order-service
    profiles: [all]
    environment:
      <<: *spring-env
      DB_URL: jdbc:postgresql://order-db:5432/order_db
      DB_PASSWORD: ${DB_PASSWORD:-dropwear}
      CLIENT_SECRET: ${ORDER_SERVICE_SECRET:-order-service-secret}
    depends_on:
      <<: *spring-deps
      order-db:
        condition: service_healthy
    restart: on-failure

  inventory-service:
    build: ./Backend/inventory-service
    profiles: [all]
    environment:
      <<: *spring-env
      DB_URL: jdbc:postgresql://inventory-db:5432/inventory_db
      DB_PASSWORD: ${DB_PASSWORD:-dropwear}
    depends_on:
      <<: *spring-deps
      inventory-db:
        condition: service_healthy
    restart: on-failure

  return-service:
    build: ./Backend/return-service
    profiles: [all]
    environment:
      <<: *spring-env
      DB_URL: jdbc:mysql://return-db:3306/return_db?allowPublicKeyRetrieval=true&useSSL=false
      DB_PASSWORD: ${DB_PASSWORD:-dropwear}
      CLIENT_SECRET: ${RETURN_SERVICE_SECRET:-return-service-secret}
    depends_on:
      <<: *spring-deps
      return-db:
        condition: service_healthy
    restart: on-failure

  ticketing-service:
    build: ./Backend/ticketing-service
    profiles: [all]
    environment:
      <<: *spring-env
      MONGO_URI: mongodb://ticketing-db:27017/ticketing_db
      CLIENT_SECRET: ${TICKETING_SERVICE_SECRET:-ticketing-service-secret}
    depends_on:
      <<: *spring-deps
      ticketing-db:
        condition: service_healthy
    restart: on-failure

  fulfillment-service:
    build: ./Backend/fulfillment-service
    profiles: [all]
    environment:
      <<: *spring-env
      DB_URL: jdbc:postgresql://fulfillment-db:5432/fulfillment_db
      DB_PASSWORD: ${DB_PASSWORD:-dropwear}
    depends_on:
      <<: *spring-deps
      fulfillment-db:
        condition: service_healthy
    restart: on-failure

  # ------------------------------------------------------------------ front-end (à activer quand le projet Angular existe)
  # frontend:
  #   build: ./Frontend/dropwear-frontend
  #   profiles: [all]
  #   ports: ["4200:80"]
  #   depends_on: [api-gateway]

volumes:
  user-db-data:
  order-db-data:
  inventory-db-data:
  fulfillment-db-data:
  return-db-data:
  catalog-db-data:
  ticketing-db-data:
  keycloak-db-data:
