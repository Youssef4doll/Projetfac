spring:
  application:
    name: ticketing-service
  config:
    # Toute la configuration (port, base, Kafka, Keycloak, Resilience4j) vient du Config Server.
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 2000
        multiplier: 1.2
        max-interval: 5000
